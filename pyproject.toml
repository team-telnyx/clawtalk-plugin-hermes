[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clawtalk-hermes"
version = "0.1.0"
description = "ClawTalk for Hermes Agent - voice calls, SMS, missions, and push approvals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Telnyx" }]
keywords = ["hermes", "hermes-agent", "clawtalk", "telnyx", "voice", "sms"]

# aiohttp is the only runtime dependency and Hermes already ships it. The REST
# SDK deliberately uses urllib so tool handlers work on any thread or loop.
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
# ruff is pinned to a minor range on purpose: new lint rules ship in minor
# releases, and an unpinned linter turns a green CI red on an unrelated day.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://www.clawdtalk.com/"
Repository = "https://github.com/team-telnyx/clawtalk-plugin-hermes"
Upstream = "https://github.com/team-telnyx/clawtalk-plugin"

# This repo IS the plugin directory, not a distributable package: Hermes loads
# it by folder name from ~/.hermes/plugins/clawtalk, and its own subpackages
# (sdk, services, tools) sit at the repo root. Building nothing is therefore
# the correct answer - setuptools would otherwise try to publish those
# subpackages as three unrelated top-level distributions.
#
# `pip install -e .` still works and is what CI and the Makefile use: it
# installs the dependencies below and nothing else.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
# The plugin imports itself as `clawtalk`, so tests must group it as
# first-party rather than mixing it into third-party imports.
known-first-party = ["clawtalk"]

[tool.ruff.lint]
# BLE is selected deliberately: several handlers must swallow everything
# (a WebSocket read loop, a tool handler, the observer tick) and each of
# those sites carries an explicit noqa saying why.
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "BLE"]
ignore = [
    "E501",   # long lines are mostly prompt text and URLs
    "B008",   # false positives on dataclass field(default_factory=...)
    "RUF012", # mutable class attrs are fine for the schema dicts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
